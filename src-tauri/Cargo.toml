[package]
name = "datalooker"
version = "0.0.0"
description = "DataLooker — a GUI database client"
edition = "2021"
rust-version = "1.98"

[lib]
# Tauri's mobile entry point links the app as a library, and the `_lib` suffix
# keeps the library name from colliding with the binary on Windows.
name = "datalooker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
ts-rs = "12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
