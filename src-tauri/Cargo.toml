[package]
name = "datalooker"
version = "0.0.0"
description = "DataLooker — a GUI database client"
edition = "2021"
rust-version = "1.98"

[lib]
# Tauri's mobile entry point links the app as a library, and the `_lib` suffix
# keeps the library name from colliding with the binary on Windows.
name = "datalooker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false }
gcp-bigquery-client = { version = "0.28", default-features = false, features = ["rust-tls"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto"] }
keyring-core = "1.0.0"
pg_query = "6.2.0"
rmcp = { version = "3.4.0", features = ["server", "transport-streamable-http-server", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
  "postgres",
  "migrate",
  "macros",
  "bigdecimal",
  "json",
  "time",
  "uuid",
] }
tauri = { version = "2", features = ["macos-private-api"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-util = "0.7"
tower-service = "0.3.3"
ts-rs = "12"
uuid = { version = "1.26.1", features = ["v4"] }
# Reads the service account key BigQuery is reached with. The BigQuery client
# takes the parsed key rather than the file, so this is named here too.
yup-oauth2 = { version = "12", default-features = false, features = ["service-account", "ring"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(unix)'.dependencies]
# For killing a command's whole process group. A safe wrapper over `killpg`,
# which is the only way to reach what the reader's command forked.
nix = { version = "0.30", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
