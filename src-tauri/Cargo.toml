[package]
name = "datalooker"
version = "0.0.0"
description = "DataLooker — a GUI database client"
edition = "2021"
rust-version = "1.98"

[lib]
# The `_lib` suffix keeps the library name from colliding with the binary on
# Windows. Only an rlib: the `staticlib` and `cdylib` Tauri's template adds are
# for a mobile build, and on macOS they cost every build an archive of every
# dependency and a longer release link.
name = "datalooker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Unpacks the BigQuery analyzer the app fetches.
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
keyring-core = "1.0.0"
pg_query = "6.2.0"
# Reaches BigQuery's REST API, and fetches the BigQuery analyzer.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
  "rustls-no-provider",
] }
rmcp = { version = "3.5.0", features = ["server", "transport-streamable-http-server", "macros"] }
# Named so that ring is the one TLS crypto provider; see `http.rs`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks what was fetched against the hash written down beside its address.
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
  "postgres",
  "migrate",
  "macros",
  "bigdecimal",
  "json",
  "time",
  "uuid",
] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
time = { version = "0.3", features = ["macros", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-util = "0.7"
tower-service = "0.3.3"
ts-rs = "12"
uuid = { version = "1.26.1", features = ["v4"] }
# Trades the service account key BigQuery is reached with for a token.
yup-oauth2 = { version = "12", default-features = false, features = [
  "hyper-rustls",
  "service-account",
  "ring",
] }

# Line tables keep file and line in a backtrace. Full debug info, for reading
# variables in a debugger, costs a sixth of a clean dev build and much of its disk.
[profile.dev]
debug = "line-tables-only"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(unix)'.dependencies]
# For killing a command's whole process group. A safe wrapper over `killpg`,
# which is the only way to reach what the reader's command forked.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
# The mock runtime, so that a test can send a command the way the window does.
tauri = { version = "2", features = ["macos-private-api", "test"] }
