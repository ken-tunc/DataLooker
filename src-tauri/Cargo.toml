[package]
name = "datalooker"
version = "0.0.0"
description = "DataLooker — a GUI database client"
edition = "2021"
rust-version = "1.98"

[lib]
# Tauri's mobile entry point links the app as a library, and the `_lib` suffix
# keeps the library name from colliding with the binary on Windows.
name = "datalooker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring-core = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
  "migrate",
  "macros",
] }
tauri = { version = "2", features = [] }
thiserror = "2"
ts-rs = "12"
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
