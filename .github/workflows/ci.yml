name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# CI never debugs the binary, so dev-profile debug symbols are pure compile and
# cache-IO overhead here. Local `cargo` builds are unaffected.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  frontend:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1

      # setup-vp installs Vite+, the pinned Node.js and the package manager,
      # and caches the dependency store.
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          cache: true

      - run: vp install --frozen-lockfile

      # `vp check` covers format, lint and type check.
      - run: vp check

      - run: vp test --run --coverage

      # The report lives on the run's own page: nothing leaves GitHub, and no
      # account has to be connected to read it.
      - name: Report coverage
        run: |
          {
            echo '## Frontend coverage'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-coverage
          path: coverage/

  rust:
    runs-on: macos-26
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2.87.17
        with:
          tool: cargo-llvm-cov

      # Runs the tests instrumented; the report comes from the same run.
      - run: cargo llvm-cov --no-report

      - name: Report coverage
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '## Rust coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
            echo 'The integration tests skip here — this runner has no Docker —'
            echo 'so `drivers/` reads lower than it does against a database.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-coverage
          path: src-tauri/lcov.info
