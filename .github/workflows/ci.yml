name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# CI never debugs the binary, so dev-profile debug symbols are pure compile and
# cache-IO overhead here. Local `cargo` builds are unaffected.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # setup-vp installs Vite+, the pinned Node.js and the package manager,
      # and caches the dependency store.
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          cache: true

      - run: vp install --frozen-lockfile

      # `vp check` covers format, lint and type check.
      - run: vp check

      - run: vp test --run --coverage

      # The report lives on the run's own page: nothing leaves GitHub, and no
      # account has to be connected to read it.
      - name: Report coverage
        run: |
          {
            echo '## Frontend coverage'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-coverage
          path: coverage/

  # Linux runs the tests because it is where a PostgreSQL container can run
  # beside them: on a macOS runner every integration test skips itself, which
  # is the whole `drivers/` suite. The release is pinned to the one carrying
  # the webkit2gtk 4.1 packages Tauri links against.
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2.87.17
        with:
          tool: cargo-llvm-cov

      - name: Start PostgreSQL
        working-directory: .
        run: docker compose up -d --wait

      # Runs the tests instrumented; the report comes from the same run.
      - run: cargo llvm-cov --no-report

      - name: Report coverage
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '## Rust coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-coverage
          path: src-tauri/lcov.info

  # The keychain is the one thing only macOS compiles, and the app ships
  # nowhere else, so this builds what Linux cannot rather than running a suite
  # that has nothing platform-specific left to say.
  macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - run: cargo clippy --all-targets -- -D warnings
