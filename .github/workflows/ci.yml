name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The one job that writes says so itself.
permissions:
  contents: read

# CI never debugs the binary, so dev-profile debug symbols are pure compile and
# cache-IO overhead here. Local `cargo` builds are unaffected.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.report.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          cache: true

      - run: vp install --frozen-lockfile

      # `vp check` covers format, lint and type check.
      - run: vp check

      # The runner has no Chromium; `--with-deps` adds its libraries.
      - run: vp exec playwright install --with-deps chromium

      - run: vp test --run --coverage

      - name: Summarize coverage
        run: |
          {
            echo '## Frontend coverage'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        id: report
        with:
          name: frontend-coverage
          path: coverage/

  # Linux, because a macOS runner has no Docker and every live test would skip.
  # Pinned to the release carrying the webkit2gtk 4.1 Tauri links against.
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    outputs:
      report: ${{ steps.report.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1

      # webkit2gtk for Tauri; libclang for pg_query's bindgen.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libclang-dev

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2.87.17
        with:
          tool: cargo-llvm-cov

      - name: Start PostgreSQL
        working-directory: .
        run: docker compose up -d --wait

      # The live language-server tests skip without `sqls`. The module is the
      # one the app pins, read from where it pins it.
      - name: Build sqls
        run: |
          module=$(grep -o 'github.com/sqls-server/sqls@v[0-9.]*' src/lsp/install.rs)
          GOBIN="$RUNNER_TEMP/bin" go install "$module"
          echo "DATALOOKER_SQLS_BIN=$RUNNER_TEMP/bin/sqls" >> "$GITHUB_ENV"

      # The cache brings back a previous run's counters, so they are cleaned.
      - run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report

      # The tests just rewrote `src/bindings/`; the frontend was checked
      # against the committed copy.
      - name: Bindings are the ones the backend writes
        working-directory: .
        run: |
          git add --intent-to-add src/bindings
          git diff --exit-code -- src/bindings

      - name: Summarize coverage
        run: |
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --summary-only > coverage/coverage.txt
          {
            echo '## Rust coverage'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        id: report
        with:
          name: rust-coverage
          path: src-tauri/coverage/

  # One comment that later runs rewrite, rather than one per push.
  coverage:
    needs: [frontend, rust]
    # A fork's token is read-only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: "*-coverage"
          path: reports

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Nothing is checked out for `gh` to read the repository from.
          GH_REPO: ${{ github.repository }}
          FRONTEND: ${{ needs.frontend.outputs.report }}
          RUST: ${{ needs.rust.outputs.report }}
        run: |
          body=$(mktemp)
          {
            echo '## Coverage'
            echo
            echo '<details><summary>Frontend</summary>'
            echo
            echo '```'
            cat reports/frontend-coverage/coverage.txt
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details><summary>Rust</summary>'
            echo
            echo '```'
            cat reports/rust-coverage/coverage.txt
            echo '```'
            echo
            echo '</details>'
            echo
            echo "Line-by-line reports: [frontend]($FRONTEND) · [Rust]($RUST). Both are"
            echo 'directories, so GitHub hands them over as a zip — open `index.html`'
            echo 'from it.'
          } > "$body"
          gh pr comment "$PR" --body-file "$body" --edit-last --create-if-none

  # Only the keychain is macOS-specific, so this compiles what Linux cannot.
  macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - run: cargo clippy --all-targets -- -D warnings
