name: Analyzer

# `bigquery-analyzer/` is built by Bazel and nothing else in the repository
# needs Bazel, so it has a workflow of its own: it runs where the helper
# changed, and the app's own CI never waits on a GoogleSQL build.
#
# A tag `analyzer-v<version>` publishes that version: the helper is built for
# Apple silicon and put on a Release of that name, which is where the app
# fetches it from, at the hash the app has written down. The version is the
# one `main.cc` answers `hello` with, and a tag that says otherwise fails.
#
# Building and publishing are two jobs for the reason `release.yml` gives: the
# token that can make a Release is never in a step that runs the build.

on:
  pull_request:
    branches: [main]
    paths:
      - "bigquery-analyzer/**"
      - ".github/workflows/analyzer.yml"
  push:
    tags: ["analyzer-v*"]

permissions: {}

concurrency:
  group: analyzer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # An Apple silicon runner, whose host is the platform the app fetches for.
    runs-on: macos-26
    # GoogleSQL is most of an hour to compile on a cold cache.
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bigquery-analyzer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: The tag names the version the helper answers with
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#analyzer-v}"
          answers="$(sed -n 's/^constexpr char kVersion\[\] = "\(.*\)";$/\1/p' main.cc)"
          if [[ "$tagged" != "$answers" ]]; then
            echo "the tag says $tagged and main.cc says $answers" >&2
            exit 1
          fi

      # Bazelisk, which reads `.bazelversion`, and a cache of what was compiled.
      # The tests and the release are both built `-c opt`, so that one cache
      # serves the two.
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: analyzer
          repository-cache: true

      - run: bazel test -c opt //:complete_test

      - name: Build the helper
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          bazel build -c opt --strip=always //:datalooker-bigquery-analyzer
          built="$(bazel info -c opt execution_root)/$(bazel cquery -c opt --output=files //:datalooker-bigquery-analyzer)"
          # It has to answer before it is published.
          printf 'Content-Length: 41\r\n\r\n{"jsonrpc":"2.0","id":1,"method":"hello"}' |
            "$built" | grep -q '"googlesql"'
          gzip -9 -c "$built" > "$RUNNER_TEMP/datalooker-bigquery-analyzer-darwin-arm64.gz"
          shasum -a 256 "$RUNNER_TEMP/datalooker-bigquery-analyzer-darwin-arm64.gz"

      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'push'
        with:
          name: analyzer
          path: ${{ runner.temp }}/datalooker-bigquery-analyzer-darwin-arm64.gz
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: analyzer

      # Not the latest Release: that is the app's, and what its release notes
      # are counted from.
      - name: Publish the helper
        run: |
          set -euo pipefail
          sha256sum datalooker-bigquery-analyzer-darwin-arm64.gz | tee checksum.txt
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "BigQuery analyzer ${GITHUB_REF_NAME#analyzer-v}" \
            --notes "The helper DataLooker completes BigQuery statements with, for Apple silicon. SHA-256: $(cut -d' ' -f1 checksum.txt)" \
            datalooker-bigquery-analyzer-darwin-arm64.gz
