name: Release

# Every push to `main` that changes more than Markdown builds the app. If the
# `v<version>` tag for package.json's version exists, the build replaces the
# rolling draft "DataLooker (unreleased)"; if not, it is published as
# `v<version>`. So cutting a release is bumping `version` and merging it.
#
# The tag, not the Release, says a version is out: it is made at the moment of
# publishing, so a publish that died halfway does not hide the version from the
# next push.
#
# Building and publishing are separate jobs so that the token that can write
# tags and Releases is never present while the repository's own code runs.

on:
  push:
    branches: [main]
    # A version bump touches package.json, so a release is never skipped.
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

permissions: {}

# Queued, not cancelled: a publish must not be killed by the merge behind it,
# and the default queue drops all but the newest, which could lose a bump.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.mode.outputs.version }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A token left in git config would be reachable from every step.
          persist-credentials: false

      # `git ls-remote --exit-code` answers 2 for a missing ref; anything else
      # is a failure to reach the remote.
      - name: Say whether this build is a release
        id: mode
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ -z "$version" || "$version" == "undefined" ]]; then
            echo "package.json has no version to build (read '$version')" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is released already — refreshing the unreleased draft."
            mode=draft
          else
            rc=$?
            if [[ "$rc" -ne 2 ]]; then
              echo "git ls-remote failed (exit $rc)" >&2
              exit "$rc"
            fi
            echo "There is no v$version tag — publishing it."
            mode=release
          fi
          {
            echo "version=$version"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          cache: true

      - run: vp install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          # The release profile shares nothing with the test builds.
          shared-key: release

      # Writes the identity's name into the environment for the build below.
      - name: Make the signing identity
        env:
          KEYCHAIN: ${{ runner.temp }}/datalooker-signing.keychain-db
        run: ./scripts/make-signing-identity.sh

      # No other APPLE_* variable: the bundler tries to import a certificate
      # whenever APPLE_CERTIFICATE exists, and an empty one fails the build.
      - name: Build the app
        run: vp run tauri build

      - name: Package the bundle
        run: tar -czf DataLooker.app.tar.gz -C src-tauri/target/release/bundle/macos DataLooker.app

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: app
          path: DataLooker.app.tar.gz
          # Only handed to the next job.
          retention-days: 1

  publish:
    needs: build
    # A dispatch can name any branch; only `main` is released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: app

      # A draft for this version is a publish that died halfway; it is dropped
      # rather than stacked beside. Created as a draft and then published, so
      # it is never seen without the app; publishing makes the tag.
      - name: Publish the release
        if: needs.build.outputs.mode == 'release'
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == ("v" + env.VERSION)) | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done

          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DataLooker v$VERSION" \
            --generate-notes \
            --draft \
            DataLooker.app.tar.gz
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

      # Both modes want this. If someone pressed "Publish release" on the
      # draft, a real `unreleased` tag exists too and every refresh would fail,
      # so it is swept; a 404 is the ordinary answer.
      - name: Drop the unreleased draft
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == "unreleased") | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/unreleased" > /dev/null 2>&1 || true

      # Recreated rather than edited, so old assets cannot pile up. The notes
      # are anchored at the newest release by name, since GitHub cannot order
      # `unreleased` against anything.
      - name: Refresh the unreleased draft
        if: needs.build.outputs.mode == 'draft'
        run: |
          set -euo pipefail
          prev="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> /dev/null || true)"
          {
            echo "> A build of \`main\` at ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%MZ))."
            echo "> Bump \`version\` in package.json to publish what is in it."
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="unreleased" \
              -f target_commitish="$GITHUB_SHA" \
              ${prev:+-f previous_tag_name="$prev"} \
              --jq .body || echo "_The notes for this build could not be written._"
          } > release-notes.md

          gh release create unreleased \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "DataLooker (unreleased)" \
            --notes-file release-notes.md \
            DataLooker.app.tar.gz
